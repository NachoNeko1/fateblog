<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} | Fate命定指冠</title>
    <meta name="description" content="{{description}}">
    <meta name="keywords" content="{{keywords}}">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans@1.0.0/dist/index.css">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="apple-touch-icon" href="../favicon.svg">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="../index.html" class="logo">
                    <span class="logo-icon">F</span>
                    <span class="logo-text">Fate命定指冠</span>
                </a>
                <div class="nav-links">
                    <a href="../index.html" class="nav-link">首页</a>
                    <a href="../about/index.html" class="nav-link">关于</a>
                    <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
                        <span class="icon-sun">☀️</span>
                        <span class="icon-moon">🌙</span>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <main class="main post-page">
        <div class="container">
            <article class="post-article">
                <header class="post-header">
                    <div class="post-header-tags">
                        {{tags}}
                    </div>
                    <h1 class="post-header-title">{{title}}</h1>
                    <div class="post-meta">
                        <span class="post-meta-item">📅 {{date}}</span>
                        <span class="post-meta-item">⏱ {{readTime}}</span>
                    </div>
                </header>

                <div class="post-body">
                    {{content}}
                    <a href="../index.html" class="back-to-list">← 返回文章列表</a>
                </div>
            </article>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <p>&copy; {{year}} Fate命定指冠. All rights reserved.</p>
                </div>
                <div class="footer-bottom">
                    <p>Powered by <strong>GitHub Pages</strong> & <strong>GitHub Actions</strong></p>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
</body>
</html>
