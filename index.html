<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate命定指冠 - 我的博客</title>
    <meta name="description" content="Fate命定指冠 - 记录生活与技术，探索未知">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans@1.0.0/dist/index.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="index.html" class="logo">
                    <span class="logo-icon">F</span>
                    <span class="logo-text">Fate命定指冠</span>
                </a>
                <div class="nav-links">
                    <a href="index.html" class="nav-link active">首页</a>
                    <a href="about/index.html" class="nav-link">关于</a>
                    <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
                        <span class="icon-sun">☀️</span>
                        <span class="icon-moon">🌙</span>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <main class="main">
        <!-- Hero Section -->
        <section class="hero">
            <div class="container">
                <div class="hero-content">
                    <h1 class="hero-title">欢迎来到 Fate命定指冠</h1>
                    <p class="hero-description">记录生活、分享技术、探索未知</p>
                    <div class="hero-tags">
                        <span class="tag"># 技术博客</span>
                        <span class="tag"># 生活随笔</span>
                        <span class="tag"># 学习笔记</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Blog Posts Section -->
        <section class="posts-section">
            <div class="container">
                <h2 class="section-title">最新文章</h2>
                <div class="posts-grid">
                    <!-- Blog Post Cards will be inserted here by JavaScript -->
                </div>
            </div>
        </section>

        <!-- Stats Section -->
        <section class="stats-section">
            <div class="container">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" data-count="10">0</div>
                        <div class="stat-label">文章总数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" data-count="15000">0</div>
                        <div class="stat-label">阅读量</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" data-count="5">0</div>
                        <div class="stat-label">专栏分类</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" data-count="100">0</div>
                        <div class="stat-label">订阅者</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <p>&copy; 2024 Fate命定指冠. All rights reserved.</p>
                    <p class="footer-links">
                        <a href="https://github.com" target="_blank">GitHub</a>
                        <span class="separator">|</span>
                        <a href="mailto:admin@example.com">Email</a>
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Blog posts data
        const blogPosts = [
            {
                id: 1,
                title: "Hello World - 我的第一篇博客",
                description: "开始记录我的博客之旅，分享我的想法和技术笔记。",
                date: "2024-01-15",
                tags: ["简介", "Hello World"],
                image: "https://picsum.photos/seed/blog1/400/200",
                readTime: "3 分钟"
            },
            {
                id: 2,
                title: "GitHub Actions 自动化部署指南",
                description: "如何使用 GitHub Actions 实现博客的自动部署和持续集成。",
                date: "2024-01-20",
                tags: ["GitHub", "DevOps", "CI/CD"],
                image: "https://picsum.photos/seed/blog2/400/200",
                readTime: "8 分钟"
            },
            {
                id: 3,
                title: "现代 CSS 布局技巧",
                description: "深入探讨 Flexbox 和 Grid 在现代网页设计中的应用。",
                date: "2024-01-25",
                tags: ["CSS", "前端", "布局"],
                image: "https://picsum.photos/seed/blog3/400/200",
                readTime: "10 分钟"
            },
            {
                id: 4,
                title: "JavaScript 异步编程完全指南",
                description: "从回调函数到 async/await，全面理解 JavaScript 异步编程。",
                date: "2024-02-01",
                tags: ["JavaScript", "异步", "编程"],
                image: "https://picsum.photos/seed/blog4/400/200",
                readTime: "15 分钟"
            },
            {
                id: 5,
                title: "响应式设计最佳实践",
                description: "打造在不同设备上都有优秀体验的网页设计。",
                date: "2024-02-10",
                tags: ["响应式", "设计", "移动端"],
                image: "https://picsum.photos/seed/blog5/400/200",
                readTime: "7 分钟"
            },
            {
                id: 6,
                title: "TypeScript 入门与实践",
                description: "从零开始学习 TypeScript，提升代码质量和开发效率。",
                date: "2024-02-15",
                tags: ["TypeScript", "类型系统", "前端"],
                image: "https://picsum.photos/seed/blog6/400/200",
                readTime: "12 分钟"
            }
        ];

        // Render blog posts
        function renderPosts() {
            const postsGrid = document.querySelector('.posts-grid');
            postsGrid.innerHTML = blogPosts.map(post => `
                <article class="post-card">
                    <div class="post-image">
                        <img src="${post.image}" alt="${post.title}" loading="lazy">
                        <div class="post-date">${post.date}</div>
                    </div>
                    <div class="post-content">
                        <div class="post-tags">
                            ${post.tags.map(tag => `<span class="post-tag">${tag}</span>`).join('')}
                        </div>
                        <h3 class="post-title"><a href="posts/${post.id}.html">${post.title}</a></h3>
                        <p class="post-description">${post.description}</p>
                        <div class="post-footer">
                            <span class="post-read-time">⏱ ${post.readTime}</span>
                            <a href="posts/${post.id}.html" class="read-more">阅读全文 →</a>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        // Theme toggle functionality
        function initThemeToggle() {
            const themeToggle = document.getElementById('theme-toggle');
            const savedTheme = localStorage.getItem('theme') || 
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });
        }

        // Animate stats
        function animateStats() {
            const stats = document.querySelectorAll('.stat-number');
            const observerOptions = {
                threshold: 0.5
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const el = entry.target;
                        const target = parseInt(el.getAttribute('data-count'));
                        let current = 0;
                        const increment = target / 50;
                        
                        const timer = setInterval(() => {
                            current += increment;
                            if (current >= target) {
                                el.textContent = target.toLocaleString();
                                clearInterval(timer);
                            } else {
                                el.textContent = Math.floor(current).toLocaleString();
                            }
                        }, 30);
                        
                        observer.unobserve(el);
                    }
                });
            }, observerOptions);

            stats.forEach(stat => observer.observe(stat));
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderPosts();
            initThemeToggle();
            animateStats();
            initDynamicBackground();
        });

        // Dynamic Background - PC vs Android adaptive
        function initDynamicBackground() {
            const isAndroid = /Android/i.test(navigator.userAgent);
            const baseUrl = isAndroid ? 'https://pic2.rkn.cc.cd/' : 'https://pic.rkn.cc.cd/';
            document.body.style.backgroundImage = `url('${baseUrl}?t=${Date.now()}')`;
        }
    </script>
</body>
</html>
