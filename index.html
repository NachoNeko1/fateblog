<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatetech命运科技 - 我的博客</title>
    <meta name="description" content="Fatetech命运科技 - 记录生活与技术，探索未知">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/harmonyos-sans@1.0.0/dist/index.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="index.html" class="logo">
                    <span class="logo-icon">F</span>
                    <span class="logo-text">Fatetech命运科技</span>
                </a>
                <div class="nav-links">
                    <a href="index.html" class="nav-link active">首页</a>
                    <a href="about/index.html" class="nav-link">关于</a>
                    <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
                        <span class="icon-sun">☀️</span>
                        <span class="icon-moon">🌙</span>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <main class="main">
        <!-- Hero Section -->
        <section class="hero">
            <div class="container">
                <div class="hero-content">
                    <h1 class="hero-title">欢迎来到 Fatetech命运科技</h1>
                    <p class="hero-description">记录生活、分享技术、探索未知</p>
                    <div class="hero-tags">
                        <span class="tag"># 技术博客</span>
                        <span class="tag"># 生活随笔</span>
                        <span class="tag"># 学习笔记</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Search Section -->
        <section class="search-section">
            <div class="container">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="🔍 搜索文章..." autocomplete="off">
                    <span class="search-count" id="search-count"></span>
                </div>
            </div>
        </section>

        <!-- Blog Posts Section -->
        <section class="posts-section">
            <div class="container">
                <h2 class="section-title">最新文章</h2>
                <div class="posts-grid" id="posts-grid">
                    <!-- Blog Post Cards will be inserted here by JavaScript -->
                </div>
                <div class="no-results" id="no-results" style="display: none;">
                    <p>😕 没有找到匹配的文章</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <p>&copy; 2026 Fatetech命运科技. All rights reserved.</p>
                    <p class="footer-links">
                        <a href="https://github.com/NachoNeko1" target="_blank">GitHub</a>
                        <span class="separator">|</span>
                        <a href="mailto:y1964829632@163.com">Email</a>
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Blog posts data (generated by build.js)
        const blogPosts = [{"id":"7","title":"\"text\"","description":"\"text\"","date":"\"2026-10-11\"","tags":["简介","text"],"readTime":"\"5 分钟\"","image":null,"hasPic":false},{"id":"6","title":"\"TypeScript 入门与实践\"","description":"\"从零开始学习 TypeScript，提升代码质量和开发效率。\"","date":"\"2026-02-15\"","tags":["TypeScript","类型系统","前端"],"readTime":"\"12 分钟\"","image":null,"hasPic":false},{"id":"5","title":"\"响应式设计最佳实践\"","description":"\"打造在不同设备上都有优秀体验的网页设计。\"","date":"\"2026-02-10\"","tags":["响应式","设计","移动端"],"readTime":"\"7 分钟\"","image":null,"hasPic":false},{"id":"4","title":"\"JavaScript 异步编程完全指南\"","description":"\"从回调函数到 async/await，全面理解 JavaScript 异步编程。\"","date":"\"2026-02-01\"","tags":["JavaScript","异步","编程"],"readTime":"\"15 分钟\"","image":null,"hasPic":false},{"id":"3","title":"\"现代 CSS 布局技巧\"","description":"\"深入探讨 Flexbox 和 Grid 在现代网页设计中的应用。\"","date":"\"2026-01-25\"","tags":["CSS","前端","布局"],"readTime":"\"10 分钟\"","image":null,"hasPic":false},{"id":"2","title":"\"GitHub Actions 自动化部署指南\"","description":"\"如何使用 GitHub Actions 实现博客的自动部署和持续集成。\"","date":"\"2026-01-20\"","tags":["GitHub","DevOps","CI/CD"],"readTime":"\"8 分钟\"","image":null,"hasPic":false},{"id":"1","title":"\"Hello World - 我的第一篇博客\"","description":"\"开始记录我的博客之旅，分享我的想法和技术笔记。\"","date":"\"2026-01-15\"","tags":["简介","Hello World"],"readTime":"\"3 分钟\"","image":null,"hasPic":false}];

        // Random image URLs
        const isAndroid = /Android/i.test(navigator.userAgent);
        const randomImagePc = 'https://pic.rkn.cc.cd/';
        const randomImageMobile = 'https://pic2.rkn.cc.cd/';
        const randomImage = isAndroid ? randomImageMobile : randomImagePc;

        // Render blog posts
        function renderPosts(posts) {
            const postsGrid = document.getElementById('posts-grid');
            const noResults = document.getElementById('no-results');

            if (posts.length === 0) {
                postsGrid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            postsGrid.style.display = 'grid';
            noResults.style.display = 'none';

            postsGrid.innerHTML = posts.map(post => {
                const imageSrc = post.image || randomImage + '?t=' + Date.now();
                const imageStyle = post.image ? '' : 'style="background-size: cover;"';
                
                return `
                    <article class="post-card" data-title="${post.title}" data-description="${post.description}" data-tags="${post.tags.join(', ')}">
                        <div class="post-image" ${imageStyle}>
                            <img src="${imageSrc}" alt="${post.title}" loading="lazy" ${!post.image ? 'style="display: none;"' : ''}>
                            <div class="post-date">${post.date}</div>
                        </div>
                        <div class="post-content">
                            <div class="post-tags">
                                ${post.tags.map(tag => `<span class="post-tag">${tag}</span>`).join('')}
                            </div>
                            <h3 class="post-title"><a href="posts/${post.id}/index.html">${post.title}</a></h3>
                            <p class="post-description">${post.description}</p>
                            <div class="post-footer">
                                <span class="post-read-time">⏱ ${post.readTime || '5 分钟'}</span>
                                <a href="posts/${post.id}/index.html" class="read-more">阅读全文 →</a>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // Search functionality
        function initSearch() {
            const searchInput = document.getElementById('search-input');
            const searchCount = document.getElementById('search-count');

            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase().trim();
                
                if (query === '') {
                    renderPosts(blogPosts);
                    searchCount.textContent = '';
                    return;
                }

                const filteredPosts = blogPosts.filter(post => {
                    const titleMatch = post.title.toLowerCase().includes(query);
                    const descMatch = post.description.toLowerCase().includes(query);
                    const tagsMatch = post.tags.some(tag => tag.toLowerCase().includes(query));
                    return titleMatch || descMatch || tagsMatch;
                });

                renderPosts(filteredPosts);
                searchCount.textContent = filteredPosts.length + ' 篇文章';
            });
        }

        // Theme toggle functionality
        function initThemeToggle() {
            const themeToggle = document.getElementById('theme-toggle');
            const savedTheme = localStorage.getItem('theme') || 
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });
        }

        // Dynamic Background - PC vs Android adaptive
        function initDynamicBackground() {
            document.body.style.backgroundImage = `url('${randomImage}?t=${Date.now()}')`;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderPosts(blogPosts);
            initSearch();
            initThemeToggle();
            initDynamicBackground();
        });
    </script>
</body>
</html>
