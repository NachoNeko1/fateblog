name: Build and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'posts/**'
      - 'templates/**'
      - 'css/**'
      - 'js/**'
      - 'about/**'
      - 'build.js'
      - 'package.json'
      - 'package-lock.json'
      - '404.html'
      - 'favicon.png'
      - 'images/**'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build
      run: node build.js
      
    - name: List built files
      run: |
        echo "=== Built HTML files ==="
        find posts -name "*.html" -type f
        echo ""
        echo "=== Main index.html ==="
        ls -la index.html
        
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: write
      pages: write
      id-token: write
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build
      run: node build.js
      
    - name: Setup Pages
      uses: actions/configure-pages@v5
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
